---
- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
  - name: Install python3-dnf (Fedora) # Pre-req for Fedora DNF Tasks
    ansible.builtin.command: dnf -y install python3-dnf
    when: ansible_facts['distribution'] == "Fedora"

  - name: Install python3-rpm (Suse) # Pre-req for Suse package management
    community.general.zypper:
      name: python3-rpm
      state: present
      update_cache: true
    when: ansible_facts['os_family'] == "Suse"

  - name: Update APT cache
    ansible.builtin.apt:
      update_cache: yes
    when:
      - ansible_facts['os_family'] == "Debian"

  - name: Install curl
    ansible.builtin.package:
      name: curl
      state: present
    when: (ansible_facts['distribution'] != "Amazon" and ansible_facts['distribution_major_version'] != "2023") and
          (ansible_facts['distribution'] != "Rocky" and ansible_facts['distribution_major_version'] != "9")

  - name: Install curl-minimal (Amazon+Rocky9)
    ansible.builtin.package:
      name: curl-minimal
      state: present
    when: (ansible_facts['distribution'] == "Amazon") or
          (ansible_facts['distribution'] == "Rocky" and ansible_facts['distribution_major_version'] == "9")