---
# Purpose: assert that the instance really ended up in the expected state.
# Molecule calls this playbook with `molecule verify`.
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
  - name: Check Tailscale service is active
    ansible.builtin.systemd:
      name: tailscale
    register: tailscale_svc
    failed_when: tailscale_svc.status.ActiveState != "active"
